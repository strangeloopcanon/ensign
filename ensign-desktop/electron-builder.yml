appId: com.strangeloopcanon.ensign
productName: Ensign
asar: true
asarUnpack:
  - "**/node_modules/@openai/codex-sdk/vendor/**"
directories:
  output: release
  buildResources: assets
files:
  - build/main/**
  - build/renderer/**
  - package.json
  - config/.env.example
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: assets/icon.ico
  legalTrademarks: Ensign
linux:
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  maintainer: Ensign Team <support@ensign.local>
  category: Development
extraResources:
  - from: assets
    to: assets
