name: macOS Signed Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd codex-desktop
          npm ci
      - name: Build (signed + notarized)
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != '' }}
        run: |
          cd codex-desktop
          npm run build:mac:signed
      - name: Build (unsigned fallback)
        if: ${{ !(env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != '' ) }}
        run: |
          cd codex-desktop
          npm run build:mac
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-dmg
          path: codex-desktop/release/*.dmg
